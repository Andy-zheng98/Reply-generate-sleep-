name: Apply sleep checks update

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-sleep-checks.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified update
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode sleep-checks-update.patch.b64 > /tmp/sleep-checks-update.patch
          git apply --index /tmp/sleep-checks-update.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Make all sleep checks reproducible"
          git push origin HEAD:main
