name: Verify bundled sleep LoRA

on:
  workflow_dispatch:
  push:
    paths:
      - "sleep_lora/**"
      - "睡眠测试/**"
      - "sleep_chat.py"
      - "verify_sleep_install.py"
      - "verify_all_sleep_checks.py"
      - "requirements-sleep-checks.txt"
      - ".github/workflows/sleep-bundle-smoke.yml"
  pull_request:
    paths:
      - "sleep_lora/**"
      - "睡眠测试/**"
      - "sleep_chat.py"
      - "verify_sleep_install.py"
      - "verify_all_sleep_checks.py"
      - "requirements-sleep-checks.txt"

jobs:
  verify-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-sleep-checks.txt
      - run: python verify_all_sleep_checks.py
