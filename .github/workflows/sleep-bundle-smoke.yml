name: Verify bundled sleep LoRA

on:
  push:
    paths:
      - "sleep_lora/**"
      - "sleep_benchmark/**"
      - "sleep_chat.py"
      - "verify_sleep_install.py"
      - ".github/workflows/sleep-bundle-smoke.yml"
  pull_request:
    paths:
      - "sleep_lora/**"
      - "sleep_benchmark/**"
      - "sleep_chat.py"
      - "verify_sleep_install.py"

jobs:
  verify-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python verify_sleep_install.py
