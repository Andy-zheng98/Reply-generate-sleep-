name: Reorganize sleep test suites

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reorganize-sleep-tests.yml

permissions:
  contents: write

jobs:
  reorganize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move both test suites into 睡眠测试
        shell: bash
        run: |
          set -euo pipefail

          old_root="sleep_benchmark"
          target_root="睡眠测试"
          comparison_root="$target_root/睡眠模型与ChatGLM3对比测试"
          insomnia_root="$target_root/失眠非药物专项测试"

          test -d "$old_root"
          test -d "$old_root/insomnia_non_drug"
          test ! -e "$target_root"

          original_count="$(find "$old_root" -type f | wc -l | tr -d ' ')"

          mkdir -p "$target_root"
          mv "$old_root/insomnia_non_drug" "$insomnia_root"
          mkdir -p "$comparison_root"

          shopt -s dotglob nullglob
          remaining=("$old_root"/*)
          test "${#remaining[@]}" -gt 0
          mv "${remaining[@]}" "$comparison_root/"
          rmdir "$old_root"

          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              "sleep_benchmark/insomnia_non_drug": "睡眠测试/失眠非药物专项测试",
              "sleep_benchmark/EXPERIMENT_REPORT.md": "睡眠测试/睡眠模型与ChatGLM3对比测试/EXPERIMENT_REPORT.md",
              "sleep_benchmark/**": "睡眠测试/**",
              "cd sleep_benchmark": 'cd "睡眠测试/睡眠模型与ChatGLM3对比测试"',
              'ROOT / "sleep_benchmark" / "insomnia_non_drug"': 'ROOT / "睡眠测试" / "失眠非药物专项测试"',
              'ROOT / "sleep_benchmark" / "benchmark"': 'ROOT / "睡眠测试" / "睡眠模型与ChatGLM3对比测试" / "benchmark"',
              'ROOT / "sleep_benchmark" / "results"': 'ROOT / "睡眠测试" / "睡眠模型与ChatGLM3对比测试" / "results"',
          }

          files = [
              Path("README.md"),
              Path("睡眠测试/睡眠模型与ChatGLM3对比测试/EXPERIMENT_REPORT.md"),
              Path("睡眠测试/失眠非药物专项测试/README.md"),
              Path("睡眠测试/失眠非药物专项测试/scripts/run_colab_v4.py"),
              Path("sleep_lora/README.md"),
              Path("verify_sleep_install.py"),
          ]
          for path in files:
              text = path.read_text(encoding="utf-8")
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")

          index_lines = [
              "# 睡眠测试",
              "",
              "本目录集中保存仓库中的两套睡眠模型测试，测试数据、运行脚本、原始输出、评分和实验说明分别保留在各自文件夹内。",
              "",
              "## 1. 睡眠模型与 ChatGLM3 对比测试",
              "",
              "目录：[`睡眠模型与ChatGLM3对比测试`](睡眠模型与ChatGLM3对比测试/)",
              "",
              "使用相同提示词和尽可能一致的生成参数，对比原始 ChatGLM3-6B 与 Sleep LoRA checkpoint-160，包含逐题输出、性能指标、规则评分、对比表和图。",
              "",
              "## 2. 失眠非药物专项测试",
              "",
              "目录：[`失眠非药物专项测试`](失眠非药物专项测试/)",
              "",
              "测试睡眠环境、音乐与声音、体操与运动、呼吸训练、多轮个体约束、长期失眠和高风险安全边界，共 20 个案例、24 个用户轮次。",
              "",
          ]
          Path("睡眠测试/README.md").write_text("\n".join(index_lines), encoding="utf-8")

          stale = []
          for path in [Path("README.md"), Path("sleep_lora/README.md"), Path("verify_sleep_install.py"), *Path("睡眠测试").rglob("*")]:
              if not path.is_file() or path.suffix.lower() not in {".md", ".py", ".yml", ".yaml"}:
                  continue
              if "sleep_benchmark" in path.read_text(encoding="utf-8"):
                  stale.append(str(path))
          if stale:
              raise SystemExit(f"仍有旧路径引用：{stale}")
          PY

          test ! -e "$old_root"
          test -f "$target_root/README.md"
          test -f "$comparison_root/EXPERIMENT_REPORT.md"
          test -f "$insomnia_root/EXPERIMENT_REPORT_ZH.md"
          test -f "$insomnia_root/results/sleep_lora_raw_v4.jsonl"

          new_count="$(find "$target_root" -type f | wc -l | tr -d ' ')"
          test "$new_count" -eq "$((original_count + 1))"

      - name: Commit organized folders
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Organize all sleep tests into two folders"
          git push origin HEAD:main
