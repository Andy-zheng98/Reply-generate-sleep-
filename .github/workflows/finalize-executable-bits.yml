name: Finalize executable bits

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-executable-bits.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mark launchers executable and remove this one-time workflow
        shell: bash
        run: |
          chmod +x run_sleep_chat.sh sleep_chat.py start_sleep_chat.command verify_sleep_install.py
          rm .github/workflows/finalize-executable-bits.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add run_sleep_chat.sh sleep_chat.py start_sleep_chat.command verify_sleep_install.py .github/workflows/finalize-executable-bits.yml
          git commit -m "Mark one-click launchers executable"
          git push origin HEAD:main
